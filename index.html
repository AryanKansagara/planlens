<!doctype html>
<html lang="en" data-brand="databricks" data-theme="brand">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanLens</title>
    <meta name="description" content="Spark / Databricks plan analyzer" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff3621'/><path d='M8 22V10h3l4 8 4-8h3v12h-2.5v-7.5L16.2 22h-1.4l-3.3-7.5V22H8z' fill='%23fff'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var brand = 'databricks'
        var themes = ['brand','expressive','vibrant','ocean','sunset','forest']
        var theme = localStorage.getItem('pl:colorTheme')
        if (themes.indexOf(theme) < 0) theme = 'brand'
        var mode = localStorage.getItem('pl:themeMode')
        if (mode !== 'light' && mode !== 'dark') mode = 'light'
        document.documentElement.dataset.brand = brand
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themeMode = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
